<style>
:root{--tape:#120d0b;--amber:#ffb000;--rec:#ff3b2f;--frame:#ebe6da;--ink:#2a211b;--dawn1:#ffd9a0;--dawn2:#f6a96b;
  --hud:'VT323','Courier New',monospace;--hand:'Caveat','Comic Sans MS',cursive}
*{box-sizing:border-box;margin:0}
body{background:var(--tape);color:#f3e9d6;font-family:var(--hud);font-size:22px;overflow-x:hidden;
  padding-top:calc(env(safe-area-inset-top,0px) + 52px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transition:background 2s}
body:not(.on){overflow:hidden;height:100vh}
body.dawn{background:linear-gradient(180deg,var(--dawn1),var(--dawn2));color:var(--ink)}
[hidden]{display:none!important}

body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:49;opacity:.13;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(3%,3%)}}

.hud,.nav{position:fixed;left:0;right:0;z-index:60;display:none;justify-content:space-between;align-items:center;gap:8px;color:var(--amber);font-size:20px}
body.on .hud,body.on .nav{display:flex}
.hud{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;background:linear-gradient(180deg,rgba(18,13,11,.85),transparent)}
.nav{bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(0deg,rgba(18,13,11,.9),transparent)}
body.dawn .hud,body.dawn .nav{color:#7a3d12;background:none}
.rec{color:var(--rec)}.rec i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
button{font:inherit;color:inherit;background:none;border:1px solid currentColor;padding:2px 12px;cursor:pointer}
button:focus-visible,.pol:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.nav button[hidden]{display:inline-block!important;visibility:hidden}

#boot{position:fixed;inset:0;z-index:80;background:#000;display:grid;place-content:center;text-align:center;gap:12px;cursor:pointer;color:var(--amber)}
#boot p{font-size:34px;animation:blink 1.4s steps(2) infinite}
#boot small{font-size:18px;opacity:.7}
#boot.off{animation:crt .7s forwards;pointer-events:none}
@keyframes crt{0%{opacity:1;filter:brightness(2)}40%{opacity:1;clip-path:inset(48% 0 48% 0)}100%{opacity:0;clip-path:inset(50% 50% 50% 50%)}}

/* pages: one at a time, tape-cut transition */
.page{display:none;max-width:900px;margin:0 auto;padding:36px 18px}
.page.active{display:block;animation:cut .4s}
@keyframes cut{0%{opacity:0;filter:brightness(3) blur(3px);transform:translateX(-8px)}60%{opacity:1;filter:brightness(1.5)}100%{filter:none;transform:none}}
h2{font-weight:400;font-size:40px;color:var(--amber);line-height:1}
body.dawn h2{color:#7a3d12}
.sub{font-family:var(--hand);font-size:29px;line-height:1.15;opacity:.9;margin:8px 0 26px;max-width:600px}
.note{font-family:var(--hand);font-size:clamp(30px,6vw,40px);line-height:1.2;max-width:600px;display:grid;gap:18px}
.center{text-align:center}
.page.center.active{min-height:62vh;display:grid;place-content:center;justify-items:center;gap:18px}
.center .note{justify-items:center}
